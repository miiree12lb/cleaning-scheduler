name: CI

on:
    push:
        branches: [main]
        # A push that only changes Markdown (README, docs) doesn't need checks or a deploy
        paths-ignore:
            - "**.md"
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Get the code
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      web/package-lock.json

            - name: Install packages
              run: |
                  npm ci
                  npm ci --prefix web

            - name: Check formatting
              run: npx prettier --check .

            - name: Lint the web app
              run: npm --prefix web run lint

            - name: Type-check the server
              run: npm run typecheck

            - name: Build the web app
              run: npm --prefix web run build

            - name: Run the tests
              run: npm run test -- --run

    deploy:
        # Only after the checks pass, and only for pushes to main (not for pull requests)
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        # Never two deploys at the same time: a second one waits for the first
        concurrency:
            group: deploy
            cancel-in-progress: false

        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        steps:
            - name: Get the code
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      web/package-lock.json

            - name: Install packages
              run: |
                  npm ci
                  npm ci --prefix web

            # First the database, then the code that needs it
            - name: Apply database migrations
              run: npx wrangler d1 migrations apply cleaning-db --remote

            - name: Build and deploy
              run: npm run deploy
